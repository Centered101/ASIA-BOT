name: CI

# ตรวจ typecheck / lint / build ทุกครั้งที่ push หรือเปิด PR เข้า main
# ก่อนหน้านี้มีแค่ CodeQL (build-mode: none) ทำให้ PR ที่ compile ไม่ผ่านก็ผ่าน CI ได้
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # ค่า env เหล่านี้เป็นค่าหลอกสำหรับ build เท่านั้น ไม่ได้เชื่อมต่อฐานข้อมูลจริง
        # Next.js ต้องการให้ตัวแปรมีค่าตอน build เพราะหลาย route อ่านค่าที่ module scope
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SESSION_SIGNING_SECRET: placeholder-ci-signing-secret-not-a-real-key
        run: npm run build
