<style>
    :root {
        --primary-color: #0056B3;
    }
</style>

<body draggable="false" oncontextmenu="return false;">
    <div id="root"></div>
    <script>

        const welcomeMessage = "สวัสดี ฉัน DOZER";

        $(document).ready(function () {

            let title = "ตู้กดอเนกประสงค์ DOZER";
            let description = "โปรดให้คะแนนความพึงพอใจของคุณต่อประสบการณ์การใช้งาน ตู้กดอเนกประสงค์ DOZER ของเรา ความคิดเห็นของคุณมีความสำคัญอย่างยิ่งในการช่วยเราปรับปรุงและพัฒนาแพลตฟอร์มให้ดียิ่งขึ้น ขอบคุณที่สละเวลาในการให้คำติชม!";

            document.title = title;

            $("#project-name").text(title);
            $("#description").text(description);

            const mascot = "./mascot.png";
            $("#poster").attr("src", "./posters.jpg");

            window.nameMap = {
                gender_male: "gender_project-1",
                gender_female: "gender_project-1",
                gender_other: "gender_project-1",

                kindergartenSelectBox: "evaluator_project-1",

                name: "name_project-1",

                emoji_3: "emoji_project-1",
                emoji_2: "emoji_project-1",
                emoji_1: "emoji_project-1",

                creative_5: "creative_project-1",
                creative_4: "creative_project-1",
                creative_3: "creative_project-1",
                creative_2: "creative_project-1",
                creative_1: "creative_project-1",

                content_5: "content_project-1",
                content_4: "content_project-1",
                content_3: "content_project-1",
                content_2: "content_project-1",
                content_1: "content_project-1",

                presentation_5: "presentation_project-1",
                presentation_4: "presentation_project-1",
                presentation_3: "presentation_project-1",
                presentation_2: "presentation_project-1",
                presentation_1: "presentation_project-1",

                usability_5: "usability_project-1",
                usability_4: "usability_project-1",
                usability_3: "usability_project-1",
                usability_2: "usability_project-1",
                usability_1: "usability_project-1",

                overall_5: "overall_project-1",
                overall_4: "overall_project-1",
                overall_3: "overall_project-1",
                overall_2: "overall_project-1",
                overall_1: "overall_project-1",

                comments: "comments_project-1"
            };

            // meta
            $('meta[property="og:title"]').attr("content", title);
            $('meta[name="twitter:title"], meta[property="twitter:title"]').attr("content", title);

            // mascot
            const $mascot = $("#mascot");
            if (!mascot) {
                $mascot.remove();
            } else {
                $mascot
                    .removeClass("hidden")
                    .attr("src", mascot)
                    .on("error", function () {
                        $(this).remove();
                    });
            }

            // preview
            const $preview = $("#preview");
            if (!preview) {
                $preview.remove();
            } else {
                $preview
                    .removeClass("hidden")
                    .attr("src", preview)
                    .on("error", function () {
                        $(this).remove();
                    });
            }

            // map name attribute
            $.each(nameMap, function (id, nameValue) {
                $("#" + id).attr("name", nameValue);
            });

            message();
        });
    </script>
    <script src="/script/ui-form.js"></script>
    <script src="/script/script.js"></script>
</body>

</html>
